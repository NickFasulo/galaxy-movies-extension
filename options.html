<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Galaxy Movies extension options</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <h1><span class="logo">GM</span> Galaxy Movies options</h1>

    <section>
      <h2>Region</h2>
      <select id="region">
        <option value="US">United States</option>
        <option value="IN">India</option>
      </select>
    </section>

    <section>
      <h2>My services <small>(★ highlighted in the chip and popup)</small></h2>
      <div id="providers" class="grid"></div>
    </section>

    <section>
      <h2>Show the chip on</h2>
      <div class="grid">
        <label><input type="checkbox" data-site="imdb" /> IMDb</label>
        <label><input type="checkbox" data-site="tmdb" /> TMDB</label>
        <label><input type="checkbox" data-site="letterboxd" /> Letterboxd</label>
      </div>
    </section>

    <button id="save">Save</button>
    <span id="saved" hidden>Saved.</span>

    <script src="options.js"></script>
  </body>
</html>
